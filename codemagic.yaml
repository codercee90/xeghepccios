workflows:
  ios-capacitor-testflight:
    name: iOS Capacitor Build & TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: XeGhepCC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: cc.xeghep.www.ios # Thay bằng Bundle ID chính xác của bạn
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 18.x
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Capacitor Sync
        script: |
          npm run build
          npx cap sync ios
      - name: CocoaPods Installation
        script: |
          cd ios/App && pod install
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build ipa for App Store
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration # Sử dụng API Key đã lưu trong Codemagic
        submit_to_testflight: true
