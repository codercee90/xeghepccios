name: Build and Deploy iOS App to TestFlight

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 1. Đảm bảo thư mục web dist tồn tại
      - name: Ensure web dist folder exists
        run: |
          mkdir -p dist
          if [ ! -f dist/index.html ]; then
            echo '<!DOCTYPE html><html><head><title>Xe Ghep</title></head><body></body></html>' > dist/index.html
          fi

      # 2. Thêm nền tảng iOS
      - name: Add Capacitor iOS Platform
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      # 3. Tạo Podfile chuẩn có tích hợp helper script của Capacitor
      - name: Ensure Podfile exists
        run: |
          mkdir -p ios/App
          cat <<'EOF' > ios/App/Podfile
          require_relative '../../node_modules/@capacitor/ios/scripts/pods_helpers'

          platform :ios, '13.0'
          use_frameworks!

          # ignore warnings from CocoaPods
          inhibit_all_warnings!

          target 'App' do
            config = get_capacitor_pod_resources
            cap_pods
            # pod dependencies will be inserted here by Capacitor
          end
          EOF

      # 4. Tạo file cấu hình Firebase
      - name: Create GoogleService-Info.plist
        run: |
          mkdir -p ios/App/App
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" > ios/App/App/GoogleService-Info.plist

      # 5. Cập nhật và đồng bộ Capacitor
      - name: Sync Capacitor iOS
        run: |
          npx cap copy ios
          npx cap update ios

      # 6. Cài đặt các thư viện CocoaPods
      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      # 7. Khởi tạo Chữ ký số & Provisioning Profile
      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 14)
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 3600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          security default-keychain -s $KEYCHAIN_PATH

          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo -n "$PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      # 8. Cấu hình Export Options
      - name: Setup Export Options Plist
        run: |
          cat <<EOF > ios/App/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.plist">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>uploadSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
          </dict>
          </plist>
          EOF

      # 9. Build Archive và xuất file IPA
      - name: Build Archive and Export IPA
        run: |
          cd ios/App
          
          xcrun agvtool new-version -all ${{ github.run_number }}

          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -allowProvisioningUpdates

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $RUNNER_TEMP/build_output \
            -allowProvisioningUpdates

      # 10. Lưu bản build IPA vào Artifacts
      - name: Upload IPA Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: App-TestFlight-Release
          path: ${{ runner.temp }}/build_output/App.ipa
