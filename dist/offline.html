<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang kết nối...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f2f2f7;
            color: #333;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #007aff;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="spinner"></div>
    <p>Đang kiểm tra kết nối mạng...</p>

    <script>
        // Đặt URL động của bạn ở đây
        const DYNAMIC_URL = "https://www.xeghep.cc/native.php?fromNativeApp=1&fromApp=iosCapacitor"; 

        function checkAndRedirect() {
            // Kiểm tra trạng thái internet của trình duyệt
            if (navigator.onLine) {
                // Thử gửi một Ping nhẹ đến Server để chắc chắn đã có IP Internet
                fetch(DYNAMIC_URL, { mode: 'no-cors', cache: 'no-store' })
                    .then(() => {
                        window.location.href = DYNAMIC_URL;
                    })
                    .catch(() => {
                        // Vẫn chưa kết nối thực sự được tới Server
                    });
            }
        }

        // 1. Kiểm tra ngay lập tức khi người dùng vừa thao tác bấm Cấp quyền mạng
        window.addEventListener('online', checkAndRedirect);

        // 2. Chạy vòng lặp kiểm tra mỗi 1.5 giây để bắt kịp thời điểm iOS cấp IP
        setInterval(checkAndRedirect, 1000);

        // Chạy thử 1 lần ngay khi trang offline nạp xong
        checkAndRedirect();
    </script>
</body>
</html>
